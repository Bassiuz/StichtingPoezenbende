<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stichting Poezenbende</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,900"
      rel="stylesheet"
    />
    <style>
      /* ponytail: self-contained page, homepage look copied in ~60 lines instead of loading the full bootstrap stack */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Roboto", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: url("/images/cat1.jpg") center/cover no-repeat fixed;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
      }
      main {
        position: relative;
        max-width: 28rem;
        margin: 2rem 1rem;
        padding: 2.5rem 2rem;
        text-align: center;
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.3);
      }
      h1 {
        font-weight: 900;
        font-size: 1.8rem;
        margin: 0 0 0.75rem;
        color: #212529;
      }
      p {
        line-height: 1.7;
        color: #666;
        margin: 0 0 1.5rem;
      }
      .photos {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      .photos img {
        width: 50%;
        min-width: 0;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 0.5rem;
      }
      .btn {
        display: block;
        margin: 0.75rem 0;
        padding: 0.9rem 1rem;
        border-radius: 2rem;
        text-decoration: none;
        font-weight: 700;
        color: #fff;
        background: #46ddb0;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-facebook {
        background: #1877f2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wij zijn Stichting Poezenbende!</h1>
      <p>
        Stichting Poezenbende helpt zwerf- en verwilderde katten en kittens in
        nood in Veldhoven. Wij zijn aangesloten bij Zwerfkatten Nederland en
        beneficiant van Stichting Dierenlot.
      </p>
      <div class="photos">
        <img src="/images/cat4.jpg" alt="Kat van Stichting Poezenbende" />
        <img src="/images/cat5.jpg" alt="Kitten van Stichting Poezenbende" />
      </div>
      <a class="btn btn-facebook" href="https://www.facebook.com/profile.php?id=100069735264663">Volg ons op Facebook</a>
      <a class="btn" href="/">Bezoek onze website</a>
      <a class="btn" href="/#doneren-section">Doneren</a>
    </main>
  </body>
</html>
